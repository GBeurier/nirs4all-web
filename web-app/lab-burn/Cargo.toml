[package]
name = "lab-burn-cnn"
version = "0.1.0"
edition = "2021"
publish = false
license = "CECILL-2.1 OR AGPL-3.0-or-later"
description = "Browser-only CNN regressors (NICON and a compact CNN) trained with Burn for the nirs4all multimodal laboratory. Not part of the nirs4all owner libraries."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
burn = { version = "=0.16.1", default-features = false, features = ["std", "ndarray", "autodiff"] }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
