name: Deploy nirs4all-web to GitHub Pages

# Builds the nirs4all-web/studio-lite single-page WASM app and publishes it to
# GitHub Pages (https://web.nirs4all.org/). The WASM packages are vendored in
# the repo, and deployment is blocked by the same client-only/runtime gates used
# by the RC branch.

on:
  push:
    branches: [main]
    paths:
      - 'studio-lite/**'
      - '.github/actions/nirs4all-ui-sibling/**'
      - '.github/actions/nirs4all-core-sibling/**'
      - '.github/actions/nirs4all-studio-sibling/**'
      - '.github/actions/nirs4all-methods-sibling/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio-lite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio-lite/package-lock.json
      - name: Provide nirs4all-ui sibling
        uses: ./.github/actions/nirs4all-ui-sibling
      - name: Provide nirs4all-core sibling
        uses: ./.github/actions/nirs4all-core-sibling
      - name: Provide nirs4all-studio sibling
        uses: ./.github/actions/nirs4all-studio-sibling
      - name: Provide nirs4all-methods sibling
        uses: ./.github/actions/nirs4all-methods-sibling

      - run: npm ci
      - name: Client-side-only contract
        run: npm run test:client-only
      - run: npm run typecheck
      - run: npm run test
      - run: NIRS4ALL_METHODS_ABI_REQUIRED=1 NIRS4ALL_STUDIO_REGISTRY_REQUIRED=1 npm run validate:catalog
      - name: Vendored nirs4all-ui shim is current
        run: NIRS4ALL_UI_SHIM_REQUIRED=1 npm run check:ui-shim
      - name: Vendored nirs4all-core shim is current
        run: NIRS4ALL_CORE_SHIM_REQUIRED=1 npm run check:core-shim
      - run: npm run build:single
      - run: npm run build
      - name: Browser smoke
        run: npm run smoke -- rt-fallback
      - name: Finalize Pages metadata
        run: |
          printf 'web.nirs4all.org\n' > dist/CNAME
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: studio-lite/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
