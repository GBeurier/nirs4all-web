name: web-ci

on:
  push:
    branches: [main, rc/v1-full-refactor]
    paths:
      - 'studio-lite/**'
      - '.github/actions/nirs4all-ui-sibling/**'
      - '.github/actions/nirs4all-core-sibling/**'
      - '.github/actions/nirs4all-studio-sibling/**'
      - '.github/actions/nirs4all-methods-sibling/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    branches: [main, rc/v1-full-refactor]
    paths:
      - 'studio-lite/**'
      - '.github/actions/nirs4all-ui-sibling/**'
      - '.github/actions/nirs4all-core-sibling/**'
      - '.github/actions/nirs4all-studio-sibling/**'
      - '.github/actions/nirs4all-methods-sibling/**'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio-lite:
    name: nirs4all-web client-only gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio-lite
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio-lite/package-lock.json
      - name: Provide nirs4all-ui sibling
        uses: ./.github/actions/nirs4all-ui-sibling
      - name: Provide nirs4all-core sibling
        uses: ./.github/actions/nirs4all-core-sibling
      - name: Provide nirs4all-studio sibling
        uses: ./.github/actions/nirs4all-studio-sibling
      - name: Provide nirs4all-methods sibling
        uses: ./.github/actions/nirs4all-methods-sibling

      - run: npm ci
      - name: Client-side-only contract
        run: npm run test:client-only
      - run: npm run typecheck
      - run: npm run test
      - run: NIRS4ALL_METHODS_ABI_REQUIRED=1 NIRS4ALL_STUDIO_REGISTRY_REQUIRED=1 npm run validate:catalog
      - name: Vendored nirs4all-ui shim is current
        run: NIRS4ALL_UI_SHIM_REQUIRED=1 npm run check:ui-shim
      - name: Vendored nirs4all-core shim is current
        run: NIRS4ALL_CORE_SHIM_REQUIRED=1 npm run check:core-shim
      - run: npm run build:single
      - run: npm run build
      - name: Browser smoke
        run: npm run smoke -- rt-fallback
