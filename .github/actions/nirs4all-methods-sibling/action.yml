name: Provide nirs4all-methods sibling
description: >-
  Clones GBeurier/nirs4all-methods next to the workspace so Web catalog checks
  can validate advertised n4m symbols against the canonical ABI snapshot.
runs:
  using: composite
  steps:
    - name: Clone nirs4all-methods next to the workspace
      shell: bash
      run: |
        sibling="$GITHUB_WORKSPACE/../nirs4all-methods"
        rm -rf "$sibling"
        git clone --depth 1 https://github.com/GBeurier/nirs4all-methods.git "$sibling"
        ref="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
        if [ -n "$ref" ]; then
          git -C "$sibling" fetch --depth 1 origin "$ref" || {
            echo "nirs4all-methods sibling: missing required ref '$ref' upstream" >&2
            exit 1
          }
          git -C "$sibling" checkout --detach FETCH_HEAD
          echo "nirs4all-methods sibling: using ref $ref @ $(git -C "$sibling" rev-parse HEAD)"
        else
          echo "nirs4all-methods sibling: no GitHub ref provided; using default branch @ $(git -C "$sibling" rev-parse HEAD)"
        fi
