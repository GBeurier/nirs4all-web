name: Provide nirs4all-core sibling
description: >-
  Clones GBeurier/nirs4all-lite next to the workspace so the vendored
  nirs4all-core JavaScript/WASM shim can be checked against its canonical
  source. The current Web RC branch maps to the core RC branch because the
  repository rename is still pending.
runs:
  using: composite
  steps:
    - name: Clone nirs4all-core source next to the workspace
      shell: bash
      run: |
        sibling="$GITHUB_WORKSPACE/../nirs4all-lite"
        rm -rf "$sibling"
        git clone --depth 1 https://github.com/GBeurier/nirs4all-lite.git "$sibling"

        requested="${NIRS4ALL_CORE_REF:-}"
        current="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
        base="${GITHUB_BASE_REF:-}"
        if [ -n "$requested" ]; then
          ref="$requested"
        elif [ "$current" = "rc/v1-full-refactor" ] || [ "$base" = "rc/v1-full-refactor" ]; then
          ref="rc/v1-full-refactor-core"
        elif [ "$current" = "main" ] || [ "$base" = "main" ]; then
          ref="main"
        else
          ref="$current"
        fi

        git -C "$sibling" fetch --depth 1 origin "$ref" || {
          echo "nirs4all-core sibling: missing required ref '$ref' upstream" >&2
          exit 1
        }
        git -C "$sibling" checkout --detach FETCH_HEAD
        echo "nirs4all-core sibling: using ref $ref @ $(git -C "$sibling" rev-parse HEAD)"
