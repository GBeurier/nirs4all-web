name: Provide nirs4all-core sibling
description: >-
  Clones GBeurier/nirs4all-core next to the workspace so the vendored
  nirs4all-core JavaScript/WASM shim can be checked against its canonical
  source.
runs:
  using: composite
  steps:
    - name: Clone nirs4all-core source next to the workspace
      shell: bash
      run: |
        expected_ref="e0f5d485eae4279f02d58fe82fad3946202e463f"
        expected_tree="3fd59b96fc5728088c6d1d207e783d826f87401f"
        sibling="$GITHUB_WORKSPACE/../nirs4all-core"
        rm -rf "$sibling"
        git clone --depth 1 https://github.com/GBeurier/nirs4all-core.git "$sibling"

        ref="${NIRS4ALL_CORE_REF:-$expected_ref}"
        if [ "$ref" != "$expected_ref" ]; then
          echo "nirs4all-core sibling: ref '$ref' does not match qualified ref '$expected_ref'" >&2
          exit 1
        fi
        git -C "$sibling" fetch --depth 1 origin "$ref" || {
          echo "nirs4all-core sibling: missing qualified ref '$ref' upstream" >&2
          exit 1
        }
        git -C "$sibling" checkout --detach FETCH_HEAD

        actual_ref=$(git -C "$sibling" rev-parse HEAD)
        actual_tree=$(git -C "$sibling" rev-parse HEAD^{tree})
        if [ "$actual_ref" != "$expected_ref" ] || [ "$actual_tree" != "$expected_tree" ]; then
          echo "nirs4all-core sibling: identity mismatch $actual_ref/$actual_tree" >&2
          exit 1
        fi
        echo "nirs4all-core sibling: using qualified ref $actual_ref (tree $actual_tree)"
