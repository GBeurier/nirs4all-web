name: Provide nirs4all-ui sibling
description: >-
  Clones GBeurier/nirs4all-ui next to the workspace so web-app can verify
  its vendored `vendor/nirs4all-ui` shim against the canonical source. Requires
  a matching branch for RC refs; feature branches use the UI default branch
  when no matching UI branch exists.
runs:
  using: composite
  steps:
    - name: Clone nirs4all-ui next to the workspace
      shell: bash
      run: |
        sibling="$GITHUB_WORKSPACE/../nirs4all-ui"
        rm -rf "$sibling"
        git clone --depth 1 https://github.com/GBeurier/nirs4all-ui.git "$sibling"
        ref="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
        if [ -n "$ref" ]; then
          if git -C "$sibling" fetch --depth 1 origin "$ref"; then
            git -C "$sibling" checkout --detach FETCH_HEAD
            echo "nirs4all-ui sibling: using ref $ref @ $(git -C "$sibling" rev-parse HEAD)"
          elif [[ "$ref" == rc/* ]]; then
            echo "nirs4all-ui sibling: missing required RC ref '$ref' upstream" >&2
            exit 1
          else
            echo "nirs4all-ui sibling: no matching feature ref '$ref'; using default branch @ $(git -C "$sibling" rev-parse HEAD)"
          fi
        else
          echo "nirs4all-ui sibling: no GitHub ref provided; using default branch @ $(git -C "$sibling" rev-parse HEAD)"
        fi
        npm --prefix "$sibling" ci
        npm --prefix "$sibling" run build
